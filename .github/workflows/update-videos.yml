name: Mise à jour automatique des vidéos

on:
  schedule:
    - cron: '*/5 * * * *'   # toutes les 5 minutes
  workflow_dispatch:          # bouton "Run workflow" manuel dans GitHub

permissions:
  contents: write             # autorise le bot à pusher data.js

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chercher de nouvelles vidéos
        run: node update.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Commit si data.js a changé
        run: |
          git config user.name "NoSpoil Bot"
          git config user.email "bot@nospoil"
          if git diff --quiet data.js; then
            echo "Aucune nouvelle vidéo."
          else
            git add data.js
            git commit -m "🎬 Nouvelles vidéos détectées"
            git push
          fi
