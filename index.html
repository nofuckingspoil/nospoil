<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>NoSpoil — Résumés sans spoilers</title>
  <style>
    :root {
      --bg:        #f8f6f1;
      --surface:   #ffffff;
      --surface2:  #f0ede7;
      --border:    #e4dfd7;
      --accent:    #e8453c;
      --accent-lo: rgba(232, 69, 60, 0.09);
      --text:      #1a1714;
      --muted:     #6e6860;
      --radius:    12px;
      --shadow:    0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }

    /* ── Main ── */
    main {
      width: 100%;
      max-width: 700px;
      padding: 2rem 1.25rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: none;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .breadcrumb.visible { display: flex; }

    .breadcrumb-item { cursor: pointer; }
    .breadcrumb-item:hover { color: var(--text); text-decoration: underline; }
    .breadcrumb-sep { opacity: 0.4; }
    .breadcrumb-current { color: var(--text); font-weight: 500; }

    /* ── Sport selector ── */
    .sport-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .sport-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      box-shadow: var(--shadow);
    }

    .sport-btn:hover { border-color: #c8c3bb; color: var(--text); }

    .sport-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-lo);
      font-weight: 600;
    }

    .sport-btn.soon {
      opacity: 0.5;
      cursor: default;
    }

    .soon-badge {
      font-size: 0.65rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── Competitions ── */
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .comp-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .comp-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--comp-color, var(--border));
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .comp-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

    .comp-card.active {
      border-color: var(--comp-color, var(--accent));
      background: color-mix(in srgb, var(--comp-color, var(--accent)) 6%, white);
    }

    .comp-card.upcoming {
      opacity: 0.55;
      cursor: default;
    }

    .comp-card.upcoming:hover { box-shadow: var(--shadow); transform: none; }

    .comp-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .comp-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── Stage list ── */
    .stage-list {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stage-empty {
      padding: 2rem 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .stage-row {
      display: flex;
      align-items: center;
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      gap: 1rem;
    }

    .stage-row:last-child { border-bottom: none; }
    .stage-row:hover { background: var(--surface2); }

    .stage-row.active {
      background: var(--accent-lo);
      border-left: 3px solid var(--accent);
    }

    .stage-row.latest {
      background: #f0fdf4;
      border-left: 3px solid #22c55e;
    }

    .stage-badge {
      display: inline-block;
      font-size: 0.6rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-weight: 700;
      vertical-align: middle;
      letter-spacing: 0.3px;
      margin-left: 0.45rem;
      background: #22c55e;
      color: #fff;
    }

    .stage-info { flex: 1; min-width: 0; }

    .stage-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .stage-route {
      font-size: 0.78rem;
      color: var(--text);
      opacity: 0.7;
      margin-top: 0.2rem;
    }

    .stage-date {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .type-pill {
      display: inline-flex;
      align-items: center;
      font-size: 0.58rem;
      padding: 0.08rem 0.4rem;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .type-sprint      { background: #dbeafe; color: #1d4ed8; }
    .type-mi-montagne { background: #ffedd5; color: #c2410c; }
    .type-montagne    { background: #fce7f3; color: #be185d; }
    .type-clm         { background: #ede9fe; color: #7c3aed; }

    .stage-play {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .stage-row:hover .stage-play { transform: scale(1.1); }

    /* ── Player ── */
    .player-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-md);
      background: #000;
    }

    .video-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem;
      text-align: center;
    }

    .video-placeholder .play-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: rgba(255,255,255,0.3);
    }

    .video-placeholder p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.3);
    }

    #yt-iframe {
      position: absolute;
      top: -18%;
      left: 0;
      width: 100%;
      height: 136%;
      border: none;
    }

    .video-glass {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

    /* ── Overlay générique ── */
    .video-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .video-overlay.hiding { opacity: 0; pointer-events: none; }
    .video-overlay.clickable { cursor: pointer; }

    .overlay-icon { font-size: 1.8rem; }
    .overlay-title { font-size: 0.9rem; font-weight: 600; color: #fff; }
    .overlay-sub { font-size: 0.72rem; color: rgba(255,255,255,0.45); }

    .overlay-play-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 0.2rem;
      transition: transform 0.15s;
    }

    .video-overlay.clickable:hover .overlay-play-btn { transform: scale(1.08); }

    /* ── Player bar ── */
    .player-bar {
      display: none;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 1rem;
      background: #1a1714;
      border-top: 1px solid #2a2520;
    }

    .player-bar.active { display: flex; }

    .ctrl-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      padding: 0.2rem;
      font-size: 0.95rem;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .ctrl-btn:hover { color: #fff; }

    .progress-wrap {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      transition: width 0.25s linear;
    }

    .progress-wrap:hover .progress-fill { background: #fff; }

    .time-display {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Sections animées ── */
    .step {
      animation: fadeUp 0.2s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Footer ── */
    footer {
      margin-top: auto;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
      border-top: 1px solid var(--border);
      width: 100%;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .comp-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">No<span>Spoil</span></div>
    <p class="tagline">Regarde le résumé. Pas le résultat.</p>
  </header>

  <main>

    <!-- Fil d'ariane -->
    <nav class="breadcrumb" id="breadcrumb" aria-label="Navigation"></nav>

    <!-- Sport -->
    <div class="step">
      <p class="section-label">Sport</p>
      <div class="sport-row">
        <button class="sport-btn active" data-sport="cyclisme">🚴 Cyclisme</button>
        <button class="sport-btn soon" disabled>🎾 Roland Garros <span class="soon-badge">Juin 2026</span></button>
        <button class="sport-btn soon" disabled>⚽ Coupe du Monde <span class="soon-badge">Été 2026</span></button>
      </div>
    </div>

    <!-- Compétitions -->
    <div class="step" id="comp-section">
      <p class="section-label">Compétition</p>
      <div class="comp-grid" id="comp-grid"></div>
    </div>

    <!-- Étapes -->
    <div class="step" id="stages-section" style="display:none">
      <p class="section-label">Étapes disponibles</p>
      <div class="stage-list" id="stage-list"></div>
    </div>

    <!-- Player -->
    <div class="step" id="player-section" style="display:none">
      <div class="player-wrap">
        <div class="video-area" id="video-area">
          <div class="video-placeholder">
            <div class="play-ring">▶</div>
            <p>Sélectionne une étape pour lancer le résumé</p>
          </div>
        </div>
        <div class="player-bar" id="player-bar">
          <button class="ctrl-btn" id="ctrl-play">⏸</button>
          <div class="progress-wrap" id="ctrl-progress">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="time-display" id="time-display">0:00 / 0:00</span>
          <button class="ctrl-btn" id="ctrl-mute">🔊</button>
          <button class="ctrl-btn" id="ctrl-fullscreen">⛶</button>
        </div>
      </div>
    </div>

  </main>

  <footer>
    Contenu diffusé via les chaînes YouTube officielles · NoSpoil n'héberge aucune vidéo
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="data.js"></script>
  <script>
    // ── Références DOM ────────────────────────────────────────────
    const breadcrumb    = document.getElementById('breadcrumb');
    const compGrid      = document.getElementById('comp-grid');
    const stagesSection = document.getElementById('stages-section');
    const stageList     = document.getElementById('stage-list');
    const playerSection = document.getElementById('player-section');
    const videoArea     = document.getElementById('video-area');
    const playerBar     = document.getElementById('player-bar');
    const ctrlPlay      = document.getElementById('ctrl-play');
    const ctrlProgress  = document.getElementById('ctrl-progress');
    const progressFill  = document.getElementById('progress-fill');
    const timeDisplay   = document.getElementById('time-display');
    const ctrlMute      = document.getElementById('ctrl-mute');
    const ctrlFullscreen= document.getElementById('ctrl-fullscreen');

    // ── État ──────────────────────────────────────────────────────
    let selectedSport = DATA.sports[0];
    let selectedComp  = null;
    let selectedStage = null;
    let ytPlayer      = null;
    let progressInterval = null;
    let isMuted  = false;
    let isPaused = false;

    // ── Type d'étape ──────────────────────────────────────────────
    const TYPE_MAP = {
      'sprint':       { label: 'Sprint',            cls: 'type-sprint' },
      'mi-montagne':  { label: 'Mi-montagne',       cls: 'type-mi-montagne' },
      'montagne':     { label: 'Montagne',           cls: 'type-montagne' },
      'clm':          { label: 'Contre-la-montre',  cls: 'type-clm' },
    };

    // ── Formatage ─────────────────────────────────────────────────
    function formatDate(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      const mois = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];
      return `${parseInt(d)} ${mois[parseInt(m) - 1]} ${y}`;
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ── Breadcrumb ────────────────────────────────────────────────
    function updateBreadcrumb() {
      const parts = [];
      if (selectedComp) {
        parts.push({ label: selectedSport.label, action: () => { selectedComp = null; selectedStage = null; renderComps(); stagesSection.style.display = 'none'; playerSection.style.display = 'none'; resetPlayer(); updateBreadcrumb(); } });
        if (selectedStage) {
          parts.push({ label: selectedComp.label, action: () => { selectedStage = null; renderStages(selectedComp); playerSection.style.display = 'none'; resetPlayer(); updateBreadcrumb(); } });
          parts.push({ label: selectedStage.label, action: null });
        } else {
          parts.push({ label: selectedComp.label, action: null });
        }
      }

      if (parts.length === 0) {
        breadcrumb.classList.remove('visible');
        return;
      }

      breadcrumb.classList.add('visible');
      breadcrumb.innerHTML = parts.map((p, i) => {
        if (i === parts.length - 1) return `<span class="breadcrumb-current">${p.label}</span>`;
        return `<span class="breadcrumb-item" onclick="(${p.action})()">${p.label}</span><span class="breadcrumb-sep">›</span>`;
      }).join('');
    }

    // ── Compétitions ──────────────────────────────────────────────
    function renderComps() {
      compGrid.innerHTML = '';
      selectedSport.competitions.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'comp-card' + (comp.status === 'upcoming' ? ' upcoming' : '') + (comp === selectedComp ? ' active' : '');
        card.style.setProperty('--comp-color', comp.color);

        const count = comp.stages.filter(s => s.video).length;
        const meta  = comp.status === 'upcoming'
          ? comp.upcomingLabel
          : count === 0 ? 'Aucun résumé disponible' : `${count} résumé${count > 1 ? 's' : ''} disponible${count > 1 ? 's' : ''}`;

        card.innerHTML = `
          <div class="comp-name">${comp.label}</div>
          <div class="comp-meta">${meta}</div>
        `;

        if (comp.status !== 'upcoming') {
          card.addEventListener('click', () => {
            selectedComp  = comp;
            selectedStage = null;
            renderComps();
            renderStages(comp);
            stagesSection.style.display = 'block';
            playerSection.style.display = 'none';
            resetPlayer();
            updateBreadcrumb();
            stagesSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          });
        }

        compGrid.appendChild(card);
      });
    }

    // ── Étapes ───────────────────────────────────────────────────
    function renderStages(comp) {
      const available = comp.stages.filter(s => s.video);
      stageList.innerHTML = '';

      if (available.length === 0) {
        stageList.innerHTML = '<div class="stage-empty">Aucun résumé disponible pour le moment.</div>';
        return;
      }

      const sorted = [...available].reverse();

      sorted.forEach((stage, i) => {
        const isLatest = i === 0;

        let rowClass = 'stage-row';
        if (stage === selectedStage) rowClass += ' active';
        else if (isLatest) rowClass += ' latest';

        const badge = isLatest
          ? '<span class="stage-badge">Dernier résumé</span>' : '';

        const ti = stage.type ? TYPE_MAP[stage.type] : null;
        const typePill  = ti ? `<span class="type-pill ${ti.cls}">${ti.label}</span>` : '';
        const routeHtml = stage.from
          ? `<div class="stage-route">${stage.from} → ${stage.to} · ${stage.km} km</div>` : '';
        const dateHtml  = stage.date
          ? `<div class="stage-date">${typePill}${formatDate(stage.date)}</div>`
          : (typePill ? `<div class="stage-date">${typePill}</div>` : '');

        const row = document.createElement('div');
        row.className = rowClass;
        row.innerHTML = `
          <div class="stage-info">
            <div class="stage-name">${stage.label}${badge}</div>
            ${routeHtml}
            ${dateHtml}
          </div>
          <div class="stage-play">▶</div>
        `;
        row.addEventListener('click', () => {
          selectedStage = stage;
          renderStages(comp);
          playerSection.style.display = 'block';
          launchPlayer(stage.video);
          updateBreadcrumb();
          playerSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        stageList.appendChild(row);
      });
    }

    // ── Overlays player ──────────────────────────────────────────
    function showLoadingOverlay() {
      const o = document.createElement('div');
      o.className = 'video-overlay'; o.id = 'loading-overlay';
      o.innerHTML = `<div class="overlay-icon">🛡️</div><div class="overlay-title">Chargement…</div><div class="overlay-sub">On cache le titre pour toi</div>`;
      videoArea.appendChild(o);
    }

    function hideLoadingOverlay() {
      const o = document.getElementById('loading-overlay');
      if (!o) return;
      o.classList.add('hiding');
      setTimeout(() => o.remove(), 400);
    }

    function showPauseOverlay() {
      if (videoArea.querySelector('.pause-overlay')) return;
      const o = document.createElement('div');
      o.className = 'video-overlay clickable pause-overlay';
      o.innerHTML = `<div class="overlay-play-btn">▶</div><div class="overlay-title">Reprendre</div><div class="overlay-sub">Ton résumé t'attend — sans spoil 🤫</div>`;
      o.addEventListener('click', () => ytPlayer?.playVideo());
      videoArea.appendChild(o);
    }

    function hidePauseOverlay() {
      const o = videoArea.querySelector('.pause-overlay');
      if (!o) return;
      o.classList.add('hiding');
      setTimeout(() => o.remove(), 400);
    }

    // ── Player ───────────────────────────────────────────────────
    function resetPlayer() {
      if (ytPlayer) { try { ytPlayer.destroy(); } catch (_) {} ytPlayer = null; }
      clearInterval(progressInterval); progressInterval = null;
      isMuted = false; isPaused = false;
      playerBar.classList.remove('active');
      ctrlPlay.textContent = '⏸';
      ctrlMute.textContent = '🔊';
      progressFill.style.width = '0%';
      timeDisplay.textContent = '0:00 / 0:00';
      videoArea.innerHTML = `
        <div class="video-placeholder">
          <div class="play-ring">▶</div>
          <p>Sélectionne une étape pour lancer le résumé</p>
        </div>`;
    }

    function updateProgress() {
      if (!ytPlayer?.getCurrentTime) return;
      const cur = ytPlayer.getCurrentTime() || 0;
      const dur = ytPlayer.getDuration()    || 0;
      progressFill.style.width = dur > 0 ? (cur / dur * 100) + '%' : '0%';
      timeDisplay.textContent  = `${formatTime(cur)} / ${formatTime(dur)}`;
    }

    function launchPlayer(videoId) {
      videoArea.innerHTML = `<div id="yt-iframe"></div><div class="video-glass"></div>`;
      showLoadingOverlay();

      ytPlayer = new YT.Player('yt-iframe', {
        videoId,
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3, cc_load_policy: 0 },
        events: {
          onReady(e) {
            e.target.playVideo();
            playerBar.classList.add('active');
            progressInterval = setInterval(updateProgress, 500);
          },
          onStateChange(e) {
            if (e.data === YT.PlayerState.PLAYING) {
              isPaused = false;
              ctrlPlay.textContent = '⏸';
              setTimeout(hideLoadingOverlay, 300);
              hidePauseOverlay();
            } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
              isPaused = true;
              ctrlPlay.textContent = '▶';
              showPauseOverlay();
            }
          },
        },
      });
    }

    // ── Contrôles ────────────────────────────────────────────────
    ctrlPlay.addEventListener('click', () => { if (!ytPlayer) return; isPaused ? ytPlayer.playVideo() : ytPlayer.pauseVideo(); });

    ctrlProgress.addEventListener('click', e => {
      if (!ytPlayer) return;
      const r = (e.clientX - ctrlProgress.getBoundingClientRect().left) / ctrlProgress.offsetWidth;
      ytPlayer.seekTo(ytPlayer.getDuration() * r, true);
    });

    ctrlMute.addEventListener('click', () => {
      if (!ytPlayer) return;
      isMuted ? (ytPlayer.unMute(), isMuted = false, ctrlMute.textContent = '🔊')
              : (ytPlayer.mute(),   isMuted = true,  ctrlMute.textContent = '🔇');
    });

    ctrlFullscreen.addEventListener('click', () => {
      const el = document.querySelector('.player-wrap');
      document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen().catch(() => {});
    });

    // ── Init ─────────────────────────────────────────────────────
    renderComps();
    updateBreadcrumb();
  </script>
</body>
</html>
